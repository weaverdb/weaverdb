
plugins {
   id 'java'
   id 'maven-publish'
}

description = 'weaver connector for java21'

jar {
    archiveBaseName = 'weaver21'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.drewnoakes:metadata-extractor:2.19.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    implementation project(':pgjava_c')
    testImplementation project(path: ':pgjava_c', configuration: 'tests')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    manifest {
        attributes (
            "Runtime-Version": Runtime.version(),
            "Language-Version": project.java.toolchain.languageVersion
        )
    }
}

def useJava21(Test t) {
    t.maxParallelForks = 1
    t.maxHeapSize = '1G'
    t.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    t.jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.weaverdb.TestVersioning'
    }
    useJava21(it)
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Java 21 JNI pgvector suite against the shared native build'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    dependsOn tasks.named('testClasses')
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.weaverdb.PgvectorJniSuite'
    }
    useJava21(it)
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

task printClasspath {
    doLast {
        configurations.testRuntimeClasspath.each { println it }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.weaverdb'
            version = '1.0'
            artifactId = 'connect21'

            from components.java
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = layout.buildDirectory.dir('repo')
        }
    }
}