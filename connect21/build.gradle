
plugins {
   id 'java'
   id 'maven-publish'
}

description = 'weaver connector for java21'

jar {
    archiveBaseName = 'weaver21'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.drewnoakes:metadata-extractor:2.19.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    implementation project(':pgjava_c')
    testImplementation project(path: ':pgjava_c', configuration: 'tests')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    manifest {
        attributes (
            "Runtime-Version": Runtime.version(),
            "Language-Version": project.java.toolchain.languageVersion
        )
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()

    systemProperty 'java.library.path', layout.projectDirectory.dir('build/mtpg/lib').asFile.absolutePath

    maxHeapSize = '1G'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }

    jvmArgs '--enable-native-access=ALL-UNNAMED'

    testLogging {
        events "passed"
    }
}

task printClasspath {
    doLast {
        configurations.testRuntimeClasspath.each { println it }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.weaverdb'
            version = '1.0'
            artifactId = 'connect21'

            from components.java
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = layout.buildDirectory.dir('repo')
        }
    }
}