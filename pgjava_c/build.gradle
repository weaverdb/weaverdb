
plugins {
   id 'java'
   id 'maven-publish'
}

configurations {
    tests
}

tasks.register('testClassesJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

artifacts {
    tests testClassesJar
}

description = 'weaver connector'

base {
    archivesName = 'weaver'
}

jar {
    archiveBaseName = 'weaver'
}

javadoc {
    source = sourceSets.main.java
    exclude "org/weaverdb/sample/**"
    exclude "org/weaverdb/base/WeaverReferenceFactory17.java"
    exclude "org/weaverdb/WeaverCmdLine.java"
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.drewnoakes:metadata-extractor:2.19.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest {
        attributes (
            "Runtime-Version": Runtime.version(),
            "Language-Version": project.java.toolchain.languageVersion
        )
    }
}

def useJava25(Test t) {
    t.maxParallelForks = 1
    t.maxHeapSize = '1G'
    t.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    t.jvmArgs '--enable-native-access=ALL-UNNAMED'
}

def forwardCrashProperties(Test t) {
    ['weaver.crash.rounds', 'weaver.crash.duration.sec', 'weaver.crash.seed',
     'weaver.crash.scenario', 'weaver.crash.include.writes', 'weaver.crash.keep',
     'weaver.crash.timeout.sec', 'weaver.crash.recover.jvms', 'weaver.sortmem',
     'weaver.crash.stdlog', 'weaver.crash.clients'].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            t.systemProperty key, value
        }
    }
}

def engineClasses(Test t) {
    t.testClassesDirs = sourceSets.test.output.classesDirs
    t.classpath = sourceSets.test.runtimeClasspath
    t.dependsOn tasks.named('testClasses')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.weaverdb.base.*'
        includeTestsMatching 'org.weaverdb.vector.*'
        includeTestsMatching 'org.weaverdb.JavaFunctionsTest'
    }
    maxParallelForks = 1
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Engine-backed JNI tests. JNITest and crash harnesses run in their own tasks.'
    engineClasses(it)
    useJava25(it)
    useJUnitPlatform {
        excludeTags 'crash-long'
    }
    filter {
        includeTestsMatching 'org.weaverdb.battle.*'
        includeTestsMatching 'org.weaverdb.Pgvector*'
        includeTestsMatching 'org.weaverdb.Vacuum*'
        includeTestsMatching 'org.weaverdb.Persistence*'
        includeTestsMatching 'org.weaverdb.ImageTest'
    }
}

tasks.register('jniTest', Test) {
    group = 'verification'
    description = 'JNITest in its own JVM so a native abort cannot hide other suites'
    engineClasses(it)
    useJava25(it)
    forkEvery = 1
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.weaverdb.JNITest'
    }
}

tasks.register('crashSmokeTest', Test) {
    group = 'verification'
    description = 'Crash-harness smoke tests, one class per JVM'
    engineClasses(it)
    useJava25(it)
    forwardCrashProperties(it)
    forkEvery = 1
    useJUnitPlatform {
        excludeTags 'crash-long'
    }
    filter {
        includeTestsMatching 'org.weaverdb.IndexHeapCrashConsistencyShellTest'
        includeTestsMatching 'org.weaverdb.IndexHeapCrashConsistencyJavaTest'
    }
}

tasks.register('soakTest', Test) {
    group = 'verification'
    description = 'Opt-in multi-hour index/heap crash soak. Not part of check.'
    engineClasses(it)
    useJava25(it)
    forwardCrashProperties(it)
    useJUnitPlatform {
        includeTags 'crash-long'
    }
    outputs.upToDateWhen { false }
    timeout = java.time.Duration.ofHours(8)
}

tasks.register('indexHeapCrashLong') {
    group = 'verification'
    description = 'Alias for soakTest'
    dependsOn tasks.named('soakTest')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest'), tasks.named('jniTest'), tasks.named('crashSmokeTest')
}

tasks.register('printClasspath') {
    doLast {
        configurations.testRuntimeClasspath.each { println it }
    }
}

tasks.register('printJavaVersion') {
    doLast {
        println "Java Toolchain Version: ${java.toolchain.languageVersion.get()}"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.weaverdb'
            version = '1.0.2'
            artifactId = 'weaverdb'
            from components.java
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = layout.projectDirectory.dir('repo')
        }
    }
}
