
plugins {
   id 'java'
   id 'maven-publish'
}

configurations {
    tests
}

tasks.register('testClassesJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

artifacts {
    tests testClassesJar
}

description = 'weaver connector'

base {
    archivesName = 'weaver'
}

jar {
    archiveBaseName = 'weaver'
}

javadoc {
    source = sourceSets.main.java
    exclude "org/weaverdb/sample/**"
    exclude "org/weaverdb/base/WeaverReferenceFactory17.java"
    exclude "org/weaverdb/WeaverCmdLine.java"
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.drewnoakes:metadata-extractor:2.19.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest {
        attributes (
            "Runtime-Version": Runtime.version(),
            "Language-Version": project.java.toolchain.languageVersion
        )
    }
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'crash-long'
    }
    maxParallelForks = 1

    // InstallNative initdbs from a copy of build_test/mtpg. Load natives from
    // build_test directly so AM OIDs match and the dylib exists before BeforeAll.
    systemProperty 'java.library.path', rootProject.file('build_test/mtpg/lib').absolutePath
    ['weaver.crash.rounds', 'weaver.crash.scenario', 'weaver.crash.seed',
     'weaver.crash.keep'].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }

    maxHeapSize = '1G'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    jvmArgs '-verbose:jni', '--enable-native-access=ALL-UNNAMED'
    testLogging {
        events "passed"
    }
}

tasks.register('indexHeapCrashLong', Test) {
    group = 'verification'
    description = 'Long-running Java multiuser index/heap crash-consistency (child JVM SIGKILL)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'crash-long'
    }
    maxParallelForks = 1
    systemProperty 'java.library.path', rootProject.file('build_test/mtpg/lib').absolutePath
    systemProperty 'weaver.repo.root', rootProject.projectDir.absolutePath
    ['weaver.crash.rounds', 'weaver.crash.duration.sec', 'weaver.crash.seed',
     'weaver.crash.scenario', 'weaver.crash.include.writes', 'weaver.crash.keep',
     'weaver.crash.timeout.sec', 'weaver.crash.recover.jvms', 'weaver.sortmem'].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }
    outputs.upToDateWhen { false }
    timeout = java.time.Duration.ofHours(8)
    maxHeapSize = '1G'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging {
        events 'passed', 'failed', 'standardOut', 'standardError'
        showStandardStreams = true
    }
}

tasks.register('printClasspath') {
    doLast {
        configurations.testRuntimeClasspath.each { println it }
    }
}

tasks.register('printJavaVersion') {
    doLast {
        println "Java Toolchain Version: ${java.toolchain.languageVersion.get()}"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.weaverdb'
            version = '1.0.2'
            artifactId = 'weaverdb'
            from components.java
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = layout.projectDirectory.dir('repo')
        }
    }
}
