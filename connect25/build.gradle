
plugins {
   id 'java'
   id 'maven-publish'
}

description = 'weaver connector for java25'

jar {
    archiveBaseName = 'weaver25'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.drewnoakes:metadata-extractor:2.19.0'
    implementation project(':pgjava_c')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes (
            "Runtime-Version": Runtime.version(),
            "Language-Version": project.java.toolchain.languageVersion
        )
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = 1

    // Native libs are produced by the top-level CMake test build (build_test/).
    // PgvectorWeaverTestSupport also stages bin/initdb from build_test → connect25/build/mtpg.
    systemProperty 'java.library.path', rootProject.file('build_test/mtpg/lib').absolutePath

    // Forward optional scale knobs for PgvectorByteaBulkStressTest.
    def bulkCount = System.getProperty('weaver.vector.bulk.count')
    if (bulkCount != null) {
        systemProperty 'weaver.vector.bulk.count', bulkCount
    }
    def bulkDim = System.getProperty('weaver.vector.bulk.dim')
    if (bulkDim != null) {
        systemProperty 'weaver.vector.bulk.dim', bulkDim
    }

    maxHeapSize = '1G'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    jvmArgs '--enable-native-access=ALL-UNNAMED'

    testLogging {
        showStandardStreams = true
    }
}

task printClasspath {
    doLast {
        configurations.testRuntimeClasspath.each { println it }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.weaverdb'
            version = '1.0'
            artifactId = 'connect25'

            from components.java
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = layout.buildDirectory.dir('repo')
        }
    }
}