
plugins {
   id 'java'
   id 'maven-publish'
}

description = 'weaver connector for java25'

jar {
    archiveBaseName = 'weaver25'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.drewnoakes:metadata-extractor:2.19.0'
    implementation project(':pgjava_c')
    testImplementation project(path: ':pgjava_c', configuration: 'tests')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes (
            "Runtime-Version": Runtime.version(),
            "Language-Version": project.java.toolchain.languageVersion
        )
    }
}

def useJava25(Test t, String heap) {
    t.maxParallelForks = 1
    t.maxHeapSize = heap
    t.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    t.jvmArgs '--enable-native-access=ALL-UNNAMED'
}

def forwardVectorProperties(Test t) {
    ['weaver.vector.bulk.count', 'weaver.vector.bulk.dim',
     'weaver.vector.ivf.count', 'weaver.vector.ivf.dim',
     'weaver.vector.ivf.lists', 'weaver.vector.ivf.probes',
     'weaver.sortmem'].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            t.systemProperty key, value
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.weaverdb.direct.TransferTypeTest'
        includeTestsMatching 'org.weaverdb.direct.JavaFunctionInvokerTest'
        includeTestsMatching 'org.weaverdb.direct.TestVersioning'
    }
    useJava25(it, '1G')
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Engine-backed FFM tests, including battle, restart, initdb, and pgvector'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    dependsOn tasks.named('testClasses')
    useJUnitPlatform()
    filter {
        excludeTestsMatching 'org.weaverdb.direct.TransferTypeTest'
        excludeTestsMatching 'org.weaverdb.direct.JavaFunctionInvokerTest'
        excludeTestsMatching 'org.weaverdb.direct.TestVersioning'
    }
    useJava25(it, '2G')
    forwardVectorProperties(it)
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

task printClasspath {
    doLast {
        configurations.testRuntimeClasspath.each { println it }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.weaverdb'
            version = '1.0'
            artifactId = 'connect25'

            from components.java
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = layout.buildDirectory.dir('repo')
        }
    }
}