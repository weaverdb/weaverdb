
plugins {

}


description = 'weaver db system'

tasks.register('buildNative') {
    group = 'build'
    description = 'Build weaver, postgres, and weaver_jni, then stamp BUILD_COMMIT'
    outputs.upToDateWhen { false }
    doLast {
        def cache = new File(rootDir, 'build_test/CMakeCache.txt')
        if (!cache.exists()) {
            exec {
                commandLine 'cmake', '-S', rootDir.absolutePath, '-B', new File(rootDir, 'build_test').absolutePath
            }
        }
        def jobs = String.valueOf(Runtime.runtime.availableProcessors())
        exec {
            commandLine 'cmake', '--build', new File(rootDir, 'build_test').absolutePath,
                    '-j', jobs, '--target', 'weaver', '--target', 'postgres', '--target', 'weaver_jni'
        }
        def git = ['git', '-C', rootDir.absolutePath, 'rev-parse', 'HEAD'].execute()
        git.waitFor()
        if (git.exitValue() != 0) {
            throw new GradleException('git rev-parse HEAD failed')
        }
        def stamp = new File(rootDir, 'build_test/mtpg/BUILD_COMMIT')
        stamp.parentFile.mkdirs()
        stamp.text = git.text.trim() + '\n'
    }
}

subprojects { sub ->
    sub.tasks.withType(Test).configureEach {
        systemProperty 'weaver.repo.root', rootDir.absolutePath
        dependsOn rootProject.tasks.named('buildNative')
    }
}
